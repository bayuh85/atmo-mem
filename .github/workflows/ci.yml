name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - name: Test
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
      - name: Build
        run: |
          go build -o atmo-mem ./cmd/atmo-mem
          ./atmo-mem version
        env:
          CGO_ENABLED: "0"
